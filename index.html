<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funeral Program</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="flipbook-container">
        <div id="flipbook">
            <!-- Pages will be added here by JavaScript -->
        </div>
        <div class="controls">
            <button id="prevBtn">← Previous</button>
            <span id="pageNumber">Page 1 of <span id="totalPages">0</span></span>
            <button id="nextBtn">Next →</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3.1.5/turn.min.js"></script>
    <script src="js/flipbook.js"></script>
</body>
</html>
